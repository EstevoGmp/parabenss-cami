<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cami - Mensagens Especiais</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Fundo Estrelado -->
    <div class="stars-container"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <img src="cami.jpg" alt="Cami" class="profile-pic">
            <h1 class="title">Cami</h1>
            <p class="subtitle">Uma constelação de qualidades em forma de pessoa</p>
            <div class="zodiac-sign">
                <i class="fas fa-star gold-icon"></i>
                <span>Seu Signo Especial</span>
                <i class="fas fa-star gold-icon"></i>
            </div>
        </div>
    </header>

    <!-- Seção de Cartas -->
    <section class="letters-section" style="padding-top: 100px;">
        <div class="section-header">
            <i class="fas fa-star gold-icon"></i>
            <h2>Mensagens Especiais</h2>
            <i class="fas fa-star gold-icon"></i>
        </div>
        <div class="envelope-carousel">
            <button class="carousel-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
            <div class="envelope-wrapper">
                <div class="envelope-container">
                    <!-- Envelopes serão gerados aqui -->
                </div>
            </div>
            <button class="carousel-btn next-btn"><i class="fas fa-chevron-right"></i></button>
        </div>
    </section>

    <!-- Seção de Presentes -->
    <section class="gifts-section">
        <div class="section-header">
            <i class="fas fa-star gold-icon"></i>
            <h2>Presentes Mágicos</h2>
            <i class="fas fa-star gold-icon"></i>
        </div>
        <div class="gifts-container">
            <!-- Presentes serão gerados aqui -->
        </div>
    </section>

    <!-- Rodapé -->
    <footer class="footer">
        <p>Feito com <i class="fas fa-heart"></i> para Cami</p>
        <div class="stars-small">
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
